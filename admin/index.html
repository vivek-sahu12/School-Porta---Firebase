<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin Login - School Data Portal</title>
  <meta name="description" content="Centralized Super Administrator Login for School Data Portal">
  <meta name="theme-color" content="#1e3a8a">

  <!-- Favicon & PWA Icons -->
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icon.svg">
  <link rel="manifest" href="../manifest.json">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/admin-login.css">

  <!-- Import Map for Firebase Modular SDK in browser -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body>
  <noscript>
    <div style="padding: 20px; background: #fee2e2; color: #991b1b; text-align: center; font-weight: 600;">
      JavaScript is required to access the Super Admin Portal. Please enable JavaScript in your browser.
    </div>
  </noscript>

  <!-- Local file protocol warning banner (hidden by default) -->
  <div id="protocol-warning" style="display: none; padding: 12px 20px; background: #fef3c7; color: #92400e; text-align: center; font-size: 0.9rem; border-bottom: 1px solid #fde68a;">
    ⚠️ <strong>Local Server Required:</strong> ES Modules cannot run directly from <code>file:///</code>. Please open using <strong>Live Server</strong> or <code>npm run dev</code>.
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <div style="display: flex; justify-content: center; margin-bottom: 10px;">
          <img src="../icon.svg" alt="School Data Portal" style="width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);">
        </div>
        <h1 class="auth-title">School Data Portal</h1>
        <p class="auth-subtitle" style="color: #1d4ed8; font-weight: 700; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em;">
          Super Admin Control Portal
        </p>
      </header>

      <!-- Error message container -->
      <div id="auth-error" class="alert-error" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="auth-error-text"></span>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Super Admin Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="admin@schoolportal.com"
              required
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Master Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input has-toggle"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              id="toggle-password"
              class="toggle-password-btn"
              aria-label="Show password"
              title="Show password"
            >
              <svg id="eye-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-hide" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In as Super Admin</span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>&copy; School Data Portal &bull; Super Admin Clearance Required</p>
        <div style="margin-top: 12px;">
          <a href="../index.html" style="font-size: 0.8rem; color: #64748b; text-decoration: none; font-weight: 500;">
            &larr; Switch to School / Staff Portal
          </a>
        </div>
      </footer>
    </div>
  </main>

  <script>
    if (window.location.protocol === 'file:') {
      const banner = document.getElementById('protocol-warning');
      if (banner) banner.style.display = 'block';
    }
  </script>
  <script type="module" src="../js/admin/login.js"></script>
</body>
</html>
