<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>School Portal Login - School Data Portal</title>
  <meta name="description" content="School Portal Authentication">
  <meta name="theme-color" content="#4f46e5">

  <!-- Favicon & PWA Icons -->
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/style.css">

  <!-- Import Map for Firebase Modular SDK in browser -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Header with Application Logo -->
      <div class="login-header">
        <div style="display: flex; justify-content: center; margin-bottom: 8px;">
          <img src="./icon.svg" alt="School Data Portal" style="width: 48px; height: 48px; border-radius: 12px; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);">
        </div>
        <h1 class="login-title">School Portal</h1>
        <p class="login-subtitle">Sign in with your School Account credentials</p>
      </div>

      <!-- Auth Error Alert -->
      <div id="auth-error" class="auth-alert" role="alert">
        <svg class="auth-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="auth-error-text"></span>
      </div>

      <!-- Login Form (Simple User ID + Password + Login) -->
      <form id="school-login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-id" class="form-label">Login ID / Email</label>
          <input
            type="email"
            id="login-id"
            class="form-input"
            placeholder="e.g. school@institution.edu"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="login-password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="login-password"
              class="form-input password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="password-toggle-btn"
              aria-label="Toggle password visibility"
              title="Show password"
            >
              <svg id="eye-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top: 8px;">
          <span class="btn-text">Sign In to School Portal</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="login-card-footer">
        <p>Access is restricted to authorized school accounts.</p>
      </div>
    </div>
  </div>

  <script type="module" src="./js/user/login.js"></script>
</body>
</html>
