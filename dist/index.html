<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Portal Login - School Data Portal</title>
  <meta name="description" content="School Portal Authentication">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


  <!-- Import Map for Firebase Modular SDK in browser -->

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
  <script type="module" crossorigin src="./assets/main-CY0BWMvc.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/firebase-DSpuSx47.js">
  <link rel="stylesheet" crossorigin href="./assets/style-Dz7ptu05.css">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Header -->
      <div class="login-header">
        <div class="school-brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path><path d="M6 10h10"></path>
          </svg>
        </div>
        <h1 class="login-title">School Portal</h1>
        <p class="login-subtitle">Sign in with your School Account credentials</p>
      </div>

      <!-- Auth Error Alert -->
      <div id="auth-error" class="auth-alert" role="alert">
        <svg class="auth-alert-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="auth-error-text"></span>
      </div>

      <!-- Login Form -->
      <form id="school-login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-id" class="form-label">Login ID / Email</label>
          <input
            type="email"
            id="login-id"
            class="form-input"
            placeholder="e.g. school@institution.edu"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" class="form-label" style="margin-bottom: 0;">Password</label>
            <button type="button" id="forgot-password-btn" class="forgot-link">Forgot Password?</button>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="login-password"
              class="form-input password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="password-toggle-btn"
              aria-label="Toggle password visibility"
              title="Show password"
            >
              <svg id="eye-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg id="eye-icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">
          <span class="btn-text">Sign In to School Portal</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <!-- Footer Info -->
      <div class="login-card-footer">
        <p>Access is restricted to authorized school accounts.</p>
      </div>
    </div>
  </div>

</body>
</html>
