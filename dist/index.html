<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - School Data Portal</title>
  <meta name="description" content="Secure administrative login for School Data Portal">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  
  <!-- Import Map for Firebase Modular SDK in browser -->

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    }
  }
  </script>
  <script type="module" crossorigin src="/assets/main-kd8TBKSk.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-BntHPb53.js">
  <link rel="stylesheet" crossorigin href="/assets/main--LhgmAo3.css">
</head>
<body>
  <!-- Full-page auth checking overlay -->
  <div id="page-loader" class="page-loader">
    <div class="page-loader-spinner" aria-hidden="true"></div>
    <p class="page-loader-text">Checking authentication...</p>
  </div>

  <main class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <div class="brand-icon-wrapper" aria-hidden="true">
          <!-- Academic / School Building Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
            <path d="M6 14h6"></path>
          </svg>
        </div>
        <h1 class="auth-title">School Data Portal</h1>
        <p class="auth-subtitle">Administration Portal</p>
      </header>

      <!-- Error message container -->
      <div id="auth-error" class="alert-error" role="alert" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="auth-error-text"></span>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="admin@school.edu"
              required
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input has-toggle"
              placeholder="••••••••••••"
              required
              autocomplete="current-password"
            >
            <button
              type="button"
              id="toggle-password"
              class="toggle-password-btn"
              aria-label="Show password"
              title="Show password"
            >
              <!-- Eye open icon (default) -->
              <svg id="eye-icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye off icon (hidden by default) -->
              <svg id="eye-icon-hide" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-btn" class="btn-primary">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <footer class="auth-footer">
        <p>&copy; School Data Portal &bull; Authorized Personnel Only</p>
      </footer>
    </div>
  </main>

</body>
</html>
